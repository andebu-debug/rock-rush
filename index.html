<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rock Rush</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rock Rush">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* VOICE: arkade-grotte, retro og leken
   IDEA: en gammel 80-talls arkadeskjerm i en gruve
   PICTURE: selve spillbrettet fyller skjermen
   COLOUR and TYPE: svart grotte, gule hjelmer, cyan diamanter; Press Start 2P
   LAYOUT: HUD-stripe øverst, spill under, styrekryss over spillet på mobil */
:root{color-scheme:dark;--ink:#f4f1e8;--gold:#ffcf3a;--gem:#3fd8ff;--red:#ff5a4f}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--ink);overflow:hidden;
  font-family:'Press Start 2P',ui-monospace,monospace;user-select:none;-webkit-user-select:none;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;height:44px;display:flex;align-items:center;gap:clamp(8px,2.5vw,28px);
  padding:0 12px;background:#0b0b0b;border-bottom:3px solid #222;font-size:clamp(9px,2.3vw,14px);white-space:nowrap;z-index:3}
#hud .g{color:var(--gem)}#hud .t{color:var(--gold)}#hud .s{margin-left:auto}#hud .l{color:var(--red)}
#hud button{font:inherit;background:#222;color:var(--ink);border:2px solid #444;border-radius:6px;padding:6px 8px;cursor:pointer}
#c{position:fixed;left:0;top:44px;display:block;image-rendering:pixelated}
#banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
  font-size:clamp(11px,3vw,18px);line-height:1.8;text-shadow:3px 3px 0 #000;opacity:0;transition:opacity .4s;z-index:4;width:92vw}
#banner b{color:var(--gold);font-size:1.4em;display:block;font-weight:400}
#ov{position:fixed;inset:0;display:flex;align-items:safe center;justify-content:center;overflow-y:auto;touch-action:pan-y;background:rgba(0,0,0,.82);z-index:10;padding:16px}
#ov.hide{display:none}
.card{text-align:center;max-width:620px;width:100%;line-height:1.9;font-size:clamp(9px,2.4vw,12px)}
.card h1{font-size:clamp(30px,9vw,64px);font-weight:400;margin:0 0 6px;color:var(--gold);
  text-shadow:4px 4px 0 #b3411f,8px 8px 0 #3a1a0a;letter-spacing:2px;line-height:1.15}
.card h2{font-size:clamp(16px,4.5vw,26px);font-weight:400;color:var(--gold);margin:0 0 12px;line-height:1.4}
.card p{margin:8px 0}
.card .big{font-size:clamp(11px,3vw,15px)}
.btn{font:inherit;font-size:clamp(12px,3vw,16px);background:var(--gold);color:#1a1205;border:0;border-radius:8px;
  padding:14px 22px;margin:14px 6px 6px;cursor:pointer;box-shadow:0 5px 0 #a8780a;min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a8780a}
.btn:focus-visible,.cv:focus-visible{outline:3px solid #fff;outline-offset:3px}
.caves{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.cv{font:inherit;width:48px;height:48px;border-radius:8px;border:2px solid #555;background:#1b1b1b;color:var(--ink);cursor:pointer}
.cv.on{border-color:var(--gold);color:var(--gold)}
.cv:disabled{opacity:.3;cursor:default}
.help{color:#aaa;font-size:clamp(8px,2vw,10px);margin-top:16px}
.help span{color:var(--ink)}
.langs{display:flex;justify-content:center;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.lg{font:inherit;font-size:clamp(10px,2.6vw,12px);min-height:44px;padding:8px 14px;border-radius:22px;border:2px solid #444;background:#151515;color:#bbb;cursor:pointer}
.lg.on{border-color:var(--gold);color:var(--gold);background:#2a2208}
.lg:focus-visible{outline:3px solid #fff;outline-offset:2px}
#hero{display:block;margin:0 auto 12px;border-radius:22px;box-shadow:0 6px 0 #3a1a0a,0 0 40px rgba(255,207,58,.25)}
.btn.alt{background:#2a2a2a;color:var(--ink);box-shadow:0 5px 0 #111;border:2px solid #555}
.foot{margin-top:26px;padding-top:14px;border-top:2px solid #222;color:#888;font-size:clamp(8px,2vw,10px)}
table.top{width:100%;border-collapse:collapse;margin:8px 0 6px;font-size:clamp(9px,2.4vw,12px)}
table.top th{color:#888;font-weight:400;text-align:left;padding:6px 4px;border-bottom:2px solid #333}
table.top td{padding:9px 4px;border-bottom:1px solid #222;text-align:left}
table.top .num{text-align:right;white-space:nowrap}table.top .nm{overflow-wrap:anywhere}
table.top tr.m0 td{color:#ffcf3a}table.top tr.m1 td{color:#d9dde2}table.top tr.m2 td{color:#e09a5a}
#nf{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
#nmIn{font:inherit;font-size:16px;padding:12px;border-radius:8px;border:2px solid #ffcf3a;background:#111;color:#fff;width:min(260px,80vw);margin-top:8px}
/* touch-kontroller */
#pad{position:fixed;left:14px;bottom:14px;display:none;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,62px);gap:4px;z-index:5}
#pad button,#snap{font:inherit;font-size:20px;background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.3);
  border-radius:12px;touch-action:none}
#pad button.on,#snap.on{background:rgba(255,207,58,.55)}
#snap{position:fixed;right:18px;bottom:40px;width:86px;height:86px;border-radius:50%;font-size:11px;display:none;z-index:5}
body.touch #pad{display:grid}body.touch #snap{display:block}
body.menu #pad,body.menu #snap{display:none}
@media (prefers-reduced-motion:reduce){#banner{transition:none}}
</style>
</head>
<body>
<div id="hud">
  <span id="hCave">1</span>
  <span class="g" id="hGem">◆ 0/0</span>
  <span class="t" id="hTime">⏱ 150</span>
  <span class="l" id="hLives">♥ 3</span>
  <span class="s" id="hScore">000000</span>
  <button id="bMenu" aria-label="Meny">☰</button>
  <button id="bMusic" aria-label="Musikk av/på">♫</button>
  <button id="bMute" aria-label="Lyd av/på">♪</button>
</div>
<canvas id="c"></canvas>
<div id="banner"></div>
<div id="pad">
  <span></span><button data-d="0" aria-label="Opp">▲</button><span></span>
  <button data-d="3" aria-label="Venstre">◀</button><span></span><button data-d="1" aria-label="Høyre">▶</button>
  <span></span><button data-d="2" aria-label="Ned">▼</button><span></span>
</div>
<button id="snap" aria-label="Grav uten å gå">GRAV</button>
<div id="ov"><div class="card" id="card"></div></div>

<script>
{
// ---------- konstanter ----------
const W=40,H=22,N=W*H;
const E=0,DIRT=1,WALL=2,STEEL=3,ROCK=4,GEM=5,PLAYER=6,FLY=7,BFLY=8,EXIT=9,BOOM=10,INBOX=11,AMOEBA=12;
const AMOEBA_MAX=160;
const OFF=[-W,1,W,-1];
const TICK=0.115;
const PAL=[
 {dirt:'#8a5a2b',dl:'#b27a42',dd:'#5e3b1a',brick:'#b8452c',bl:'#e0704f',mortar:'#3a1c12'},
 {dirt:'#2f5f86',dl:'#4f86b0',dd:'#1b3b57',brick:'#9a9a3a',bl:'#c9c95d',mortar:'#2b2b10'},
 {dirt:'#7b3a1e',dl:'#a8552e',dd:'#4d220f',brick:'#7a7a86',bl:'#a6a6b5',mortar:'#24242b'},
 {dirt:'#3f7a3a',dl:'#62a35a',dd:'#244a21',brick:'#8a4fa8',bl:'#b37ad0',mortar:'#2a1736'},
 {dirt:'#8a7a2b',dl:'#b8a447',dd:'#5a4e15',brick:'#a83a5a',bl:'#d0607f',mortar:'#33101c'},
 {dirt:'#5a3f86',dl:'#7d62b0',dd:'#352357',brick:'#3a8a7a',bl:'#5db8a6',mortar:'#0f2b25'},
 {dirt:'#86602f',dl:'#b0864f',dd:'#573c1b',brick:'#4a6fb8',bl:'#7395e0',mortar:'#121e3a'},
 {dirt:'#6b2a2a',dl:'#994444',dd:'#421515',brick:'#c9862a',bl:'#eeb056',mortar:'#3a240a'},
 {dirt:'#2a6b66',dl:'#43968f',dd:'#16423f',brick:'#b34fa0',bl:'#da7ac8',mortar:'#361030'},
 {dirt:'#555560',dl:'#7c7c8a',dd:'#33333b',brick:'#c24a2a',bl:'#ea7450',mortar:'#3a120a'}
];

// ---------- tilstand ----------
const g=new Uint8Array(N),fall=new Uint8Array(N),dir=new Uint8Array(N),done=new Uint8Array(N),stage=new Uint8Array(N),res=new Uint8Array(N);
let cave=0,lives=3,score=0,nextLife=1000,got=0,need=0,gemVal=10,extraVal=15,timeLeft=150,exitOpen=false;
let state='title',tickN=0,acc=0,ppos=-1,alive=true,deadT=0,flash=0,pushT=0,lastMove=-9,face=0,winT=0,paused=false;
let T=32,VW=20,VH=12,camX=0,camY=0,spr=null,palIdx=0,dpr=1;
let best=0,unlocked=1,amoebaN=0;
try{best=+localStorage.getItem('rr_best')||0;unlocked=Math.max(1,+localStorage.getItem('rr_unl')||1)}catch(e){}

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);

// ---------- tilfeldighet ----------
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- lyd ----------
let AC=null,muted=false,noiseBuf=null,sfxThisTick={};
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();startMusic();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.6,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null}
  if(AC&&AC.state==='suspended')AC.resume();
  startMusic();
}
function tone(f,dur,type,vol,t0=0,f2){
  const t=AC.currentTime+t0,o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,freq,vol){
  const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();
  s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=freq;gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f).connect(gn).connect(AC.destination);s.start(t);s.stop(t+dur);
}
function sfx(k){
  if(muted||!AC||sfxThisTick[k])return;sfxThisTick[k]=1;
  try{
  if(k==='dig')noise(0.05,1800,0.06);
  else if(k==='step')noise(0.03,600,0.03);
  else if(k==='gem'){tone(1046,0.08,'square',0.07);tone(1568,0.12,'square',0.06,0.06)}
  else if(k==='gemland')tone(2093,0.09,'triangle',0.08);
  else if(k==='rock')noise(0.14,380,0.35);
  else if(k==='push')noise(0.09,250,0.2);
  else if(k==='boom'){noise(0.6,900,0.6);tone(110,0.5,'sawtooth',0.15,0,40)}
  else if(k==='exit'){[523,659,784,1046].forEach((f,i)=>tone(f,0.15,'square',0.07,i*0.08))}
  else if(k==='appear')tone(220,0.3,'square',0.08,0,880);
  else if(k==='win'){[523,659,784,1046,1318].forEach((f,i)=>tone(f,0.18,'square',0.07,i*0.1))}
  else if(k==='blob')tone(70+Math.random()*30,0.12,'triangle',0.06,0,50);
  else if(k==='tick')tone(1500,0.03,'square',0.03);
  else if(k==='life'){[784,988,1175,1568].forEach((f,i)=>tone(f,0.12,'triangle',0.09,i*0.07))}
  }catch(e){}
}


// ---------- NES-musikk (egen melodi, 2 pulskanaler + trekant + støy) ----------
let musicOn=true,musGain=null,pulse25=null,pulse12=null,musTimer=0,musStep=0,musNext=0,musPlaying=false;
try{musicOn=localStorage.getItem('rr_music')!=='0'}catch(e){}
const STEP=60/150/4;
const NN={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function nm(t){const m=t.match(/^([A-G]#?)(\d)$/);return 12*(+m[2]+1)+NN[m[1]]}
const MEL=[
 "A4 . C5 . E5 - - . D5 . C5 . B4 - A4 -","C5 - - . A4 . F4 . A4 . C5 . F5 - - -",
 "E5 - G5 - E5 . C5 . D5 . E5 . G5 - - .","D5 - - . B4 . G4 . B4 . D5 . G5 - F5 -",
 "E5 - A5 - - . G5 . E5 . C5 . D5 - E5 -","F5 - - . E5 . C5 . A4 . C5 . F5 - - .",
 "D5 . F5 . A5 - - . G5 . F5 . E5 - D5 -","E5 - - - G#5 - - - B5 - - - G#5 . E5 .",
 "A5 - - . G5 . F5 . E5 - - . C5 . D5 .","D5 - - . E5 . F5 . G5 - - . B4 . D5 .",
 "E5 - - . D5 . B4 . G4 - - . B4 . E5 .","A4 - - - - - - . C5 . E5 . A5 - - .",
 "A5 - - . G5 . F5 . A5 - - . C6 - - .","B5 - - . A5 . G5 . D5 - - . G5 - - .",
 "G#5 - - . F#5 . E5 . D5 - - . B4 - - .","E5 - - - - - - - E4 . G#4 . B4 . D5 ."
].map(b=>b.split(' '));
// akkord per takt: [grunntone, moll?]
const CH=[[45,1],[41,0],[48,0],[43,0],[45,1],[41,0],[50,1],[40,0],[41,0],[43,0],[40,1],[45,1],[41,0],[43,0],[40,0],[40,0]];
function pulseWave(d){const n=32,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)re[k]=4/(k*Math.PI)*Math.sin(k*Math.PI*d);return AC.createPeriodicWave(re,im)}
function mf(m){return 440*Math.pow(2,(m-69)/12)}
function note(wave,m,t,dur,vol){
  const o=AC.createOscillator(),gn=AC.createGain();
  if(typeof wave==='string')o.type=wave;else o.setPeriodicWave(wave);
  o.frequency.setValueAtTime(mf(m),t);
  gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+0.005);
  gn.gain.linearRampToValueAtTime(vol*0.7,t+dur*0.6);gn.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(gn).connect(musGain);o.start(t);o.stop(t+dur+0.02);
}
function drum(kind,t){
  const sN=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();sN.buffer=noiseBuf;
  const L=kind==='k'?0.12:kind==='s'?0.1:0.03;
  f.type=kind==='h'?'highpass':'bandpass';f.frequency.value=kind==='k'?150:kind==='s'?1800:7000;
  gn.gain.setValueAtTime(kind==='h'?0.12:0.35,t);gn.gain.exponentialRampToValueAtTime(0.001,t+L);
  sN.connect(f).connect(gn).connect(musGain);sN.start(t);sN.stop(t+L);
  if(kind==='k'){const o=AC.createOscillator(),g2=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+0.1);
    g2.gain.setValueAtTime(0.5,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.12);o.connect(g2).connect(musGain);o.start(t);o.stop(t+0.13)}
}
function schedStep(st,t){
  const bar=Math.floor(st/16)%16,i=st%16,mel=MEL[bar],[root,minor]=CH[bar];
  const tok=mel[i];
  if(tok!=='-'&&tok!=='.'){let len=1;while(i+len<16&&mel[i+len]==='-')len++;note(pulse25,nm(tok),t,len*STEP*0.95,0.11)}
  // arpeggio
  const tri=[0,minor?3:4,7,12],an=root+24+tri[i%4];note(pulse12,an,t,STEP*0.8,0.035);
  // trekant-bass
  if(i%2===0)note('triangle',root+(i%4===2?12:0),t,STEP*1.8,0.3);
  // trommer
  if(i===0||i===8||i===10)drum('k',t);if(i===4||i===12)drum('s',t);if(i%2===1)drum('h',t);
}
function musicTick(){
  if(!AC||!musPlaying)return;
  if((paused&&!menuOpen)){musNext=AC.currentTime+0.05;return}
  while(musNext<AC.currentTime+0.2){schedStep(musStep,musNext);musStep++;musNext+=STEP}
}
function startMusic(){
  if(!AC||muted||!musicOn||musPlaying)return;
  if(!musGain){musGain=AC.createGain();musGain.gain.value=0.5;musGain.connect(AC.destination);pulse25=pulseWave(0.25);pulse12=pulseWave(0.125)}
  musPlaying=true;musStep=0;musNext=AC.currentTime+0.1;musTimer=setInterval(musicTick,25);
}
function stopMusic(){musPlaying=false;clearInterval(musTimer)}
function toggleMusic(){musicOn=!musicOn;try{localStorage.setItem('rr_music',musicOn?'1':'0')}catch(e){}$('bMusic').textContent=musicOn?'♫':'♫̸';$('bMusic').style.opacity=musicOn?1:.4;initAudio();if(musicOn)startMusic();else stopMusic()}

// ---------- grafikk ----------
function mk(S,fn){const c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');fn(x,S/16,S);return c}
function R(x,u,a,b,w,h,col){x.fillStyle=col;x.fillRect(Math.round(a*u),Math.round(b*u),Math.ceil(w*u),Math.ceil(h*u))}
function steel(x,u,S){
  x.fillStyle='#4b525d';x.fillRect(0,0,S,S);R(x,u,1,1,14,14,'#98a1ac');R(x,u,1,1,14,1,'#d3dae0');R(x,u,1,1,1,14,'#d3dae0');
  R(x,u,2,14,13,1,'#666e7b');R(x,u,14,2,1,13,'#666e7b');
  [[3.5,3.5],[12.5,3.5],[3.5,12.5],[12.5,12.5]].forEach(([a,b])=>{x.fillStyle='#eef2f5';x.beginPath();x.arc(a*u,b*u,0.9*u,0,7);x.fill()});
}
function door(x,u,S,lit){
  steel(x,u,S);R(x,u,4,2.5,8,12,lit?'#fff4b0':'#ffcf3a');R(x,u,5,3.5,6,11,'#1a1208');
  R(x,u,5,3.5,6,1,lit?'#ffcf3a':'#6b4d10');x.fillStyle='#ffcf3a';x.beginPath();x.arc(9.6*u,9*u,0.7*u,0,7);x.fill();
}
function miner(x,u,f,step,blink){
  // f: -1 venstre, 0 front, 1 høyre
  const sh=f;
  R(x,u,4,1,8,3,'#ffcf3a');R(x,u,5,0.5,6,1,'#ffe27a');R(x,u,3,4,10,1,'#c99500');
  if(f===0)R(x,u,7,1.6,2,1.4,'#fff');else R(x,u,f<0?4:10,1.6,2,1.4,'#fff');
  R(x,u,5,5,6,3,'#f1c27d');
  if(blink)R(x,u,6+sh*0.5,6.3,4,0.6,'#3a2414');else{R(x,u,6+sh*0.7,6,1,1.2,'#1a1a1a');R(x,u,9+sh*0.7,6,1,1.2,'#1a1a1a')}
  R(x,u,5,7.6,6,0.5,'#c98f5a');
  R(x,u,4,8,8,2,'#d8372c');R(x,u,4,10,8,2.5,'#2f5fd0');R(x,u,5.5,8,1,2,'#2f5fd0');R(x,u,9.5,8,1,2,'#2f5fd0');
  const arm=step&&f!==0?1:0;
  R(x,u,2.8,8+arm,1.3,3,'#f1c27d');R(x,u,11.9,8+(1-arm)*(f!==0&&step?1:0),1.3,3,'#f1c27d');
  if(!step){R(x,u,5,12.5,2,2.5,'#2f5fd0');R(x,u,9,12.5,2,2.5,'#2f5fd0');R(x,u,4.5,15,3,1,'#3a2414');R(x,u,8.5,15,3,1,'#3a2414')}
  else{R(x,u,4,12.5,2,2.5,'#2f5fd0');R(x,u,10,12.5,2,2,'#2f5fd0');R(x,u,3.5,15,3,1,'#3a2414');R(x,u,9.5,14.5,3,1,'#3a2414')}
}
function buildSprites(p,size){

  s.steel=mk(S,steel);
  s.rock=mk(S,(x,u)=>{const gr=x.createRadialGradient(5.5*u,5*u,u*.5,8*u,8.6*u,7.5*u);gr.addColorStop(0,'#f3ede2');gr.addColorStop(.45,'#aca395');gr.addColorStop(1,'#463f38');
    x.fillStyle=gr;x.beginPath();x.ellipse(8*u,8.6*u,7*u,6.7*u,0,0,7);x.fill();x.strokeStyle='rgba(0,0,0,.55)';x.lineWidth=u*.6;x.stroke();
    x.strokeStyle='rgba(50,40,30,.55)';x.lineWidth=u*.5;x.beginPath();x.moveTo(9.5*u,3.5*u);x.lineTo(10.3*u,6.5*u);x.lineTo(8.8*u,8.6*u);x.moveTo(5*u,11*u);x.lineTo(7*u,12.5*u);x.stroke()});
  const gc=['#e8fbff','#7fe6ff','#2bb8e6','#0a6f9e'];
  s.gem=[0,1,2,3].map(f=>mk(S,(x,u)=>{
    const c=i=>gc[(i+f)%4];
    const tri=(a,col)=>{x.fillStyle=col;x.beginPath();x.moveTo(a[0]*u,a[1]*u);for(let i=2;i<a.length;i+=2)x.lineTo(a[i]*u,a[i+1]*u);x.closePath();x.fill()};
    tri([8,1.5,1.5,6,8,6],c(0));tri([8,1.5,14.5,6,8,6],c(1));tri([1.5,6,8,14.8,8,6],c(2));tri([14.5,6,8,14.8,8,6],c(3));
    x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=u*.4;x.beginPath();x.moveTo(1.5*u,6*u);x.lineTo(14.5*u,6*u);x.moveTo(5*u,6*u);x.lineTo(8*u,14.8*u);x.lineTo(11*u,6*u);x.stroke();
    x.strokeStyle='#05384f';x.lineWidth=u*.5;x.beginPath();x.moveTo(8*u,1.5*u);x.lineTo(14.5*u,6*u);x.lineTo(8*u,14.8*u);x.lineTo(1.5*u,6*u);x.closePath();x.stroke();
    const sp=[[4.5,4],[11,4.5],[9.5,9],[6,8.5]][f];x.fillStyle='#fff';x.fillRect((sp[0]-.3)*u,(sp[1]-1.5)*u,.6*u,3*u);x.fillRect((sp[0]-1.5)*u,(sp[1]-.3)*u,3*u,.6*u)}));

    const el=(a,b,rx,ry,col)=>{x.fillStyle=col;x.beginPath();x.ellipse(a*u,b*u,rx*u,ry*u,0,0,7);x.fill()};
    el(-3.6,-2.6,3.6,3.3,'#ff5fb0');el(3.6,-2.6,3.6,3.3,'#ff5fb0');el(-3,3.2,2.7,2.5,'#8a6bff');el(3,3.2,2.7,2.5,'#8a6bff');
    el(-3.6,-2.6,1.4,1.3,'#fff0f8');el(3.6,-2.6,1.4,1.3,'#fff0f8');x.restore();R(x,u,7.4,3,1.2,10,'#1a1020');R(x,u,6.4,1.8,1,1.4,'#1a1020');R(x,u,8.6,1.8,1,1.4,'#1a1020')}));
  s.amoeba=[0,1,2,3].map(f=>mk(S,(x,u,S)=>{x.fillStyle='#0d4a22';x.fillRect(0,0,S,S);
    const bl=[[4,4],[11,5],[6,11],[12,12],[8,8]];
    bl.forEach(([a,b],k)=>{const w=Math.sin((f+k)*Math.PI/2)*0.8;

      x.fillStyle='#8af59f';x.beginPath();x.arc((a+w-1)*u,(b-w-1.2)*u,1*u,0,7);x.fill()});

    x.fillStyle=col;const n=8;x.beginPath();for(let k=0;k<n*2;k++){const a=k*Math.PI/n,rr=(k%2?r*.6:r)*u;x.lineTo(8*u+Math.cos(a+i)*rr,8*u+Math.sin(a+i)*rr)}x.fill();
    if(i<3){x.fillStyle='#fff';x.beginPath();x.arc(8*u,8*u,r*.35*u,0,7);x.fill()}}));
  return s;
}

// ---------- brett ----------
function genCave(n){
  const r=rng(1000+n*7919),lv=Math.min(n,12);
  g.fill(0);fall.fill(0);dir.fill(0);stage.fill(0);res.fill(0);
  const pRock=0.095+lv*0.011,pGem=0.062-lv*0.0018,pEmpty=0.045,pWall=0.008+lv*0.002;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x;
    if(x===0||y===0||x===W-1||y===H-1){g[i]=STEEL;continue}
    const v=r();
    g[i]=v<pRock?ROCK:v<pRock+pGem?GEM:v<pRock+pGem+pEmpty?E:v<pRock+pGem+pEmpty+pWall?WALL:DIRT;
  }
  // murvegger
  const lines=2+(n%3)+Math.floor(lv/4);
  for(let k=0;k<lines;k++){
    if(r()<0.65){const y=3+Math.floor(r()*(H-6)),x1=2+Math.floor(r()*(W-14)),len=8+Math.floor(r()*14);
      for(let x=x1;x<Math.min(W-1,x1+len);x++)g[y*W+x]=WALL;}
    else{const x=4+Math.floor(r()*(W-8)),y1=2+Math.floor(r()*6),len=6+Math.floor(r()*10);
      for(let y=y1;y<Math.min(H-1,y1+len);y++)g[y*W+x]=WALL;}
  }
  // startpunkt
  const sx=2+Math.floor(r()*4),sy=2+Math.floor(r()*4);
  for(let y=sy-1;y<=sy+1;y++)for(let x=sx-1;x<=sx+1;x++)if(g[y*W+x]!==STEEL)g[y*W+x]=DIRT;
  g[sy*W+sx]=INBOX;
  // fiender i små kamre
  const nF=n<1?0:Math.min(1+Math.floor(n/2),6),nB=n<2?0:Math.min(1+Math.floor((n-2)/2),4);
  let bTotal=0;
  for(let k=0;k<nF+nB;k++){
    let cx,cy,tries=0;
    do{cx=3+Math.floor(r()*(W-8));cy=3+Math.floor(r()*(H-7));tries++}while(Math.abs(cx-sx)+Math.abs(cy-sy)<12&&tries<50);
    const w=3+Math.floor(r()*3),h=2+Math.floor(r()*2);
    for(let y=cy-1;y<=cy+h;y++)for(let x=cx-1;x<=cx+w;x++){
      const i=y*W+x;if(g[i]===STEEL||g[i]===INBOX)continue;
      g[i]=(y===cy-1||y===cy+h||x===cx-1||x===cx+w)?DIRT:E;
    }
    const i=cy*W+cx;g[i]=k<nF?FLY:BFLY;dir[i]=Math.floor(r()*4);if(k>=nF)bTotal++;
  }
  // amøbe
  if((n>=3&&n%2===1)||n>=8){
    const nA=n>=7?2:1;
    for(let k=0;k<nA;k++){
      let ax,ay,tries=0;
      do{ax=4+Math.floor(r()*(W-8));ay=4+Math.floor(r()*(H-8));tries++}while(Math.abs(ax-sx)+Math.abs(ay-sy)<14&&tries<50);
      for(let y=ay-1;y<=ay+1;y++)for(let x=ax-1;x<=ax+1;x++){const i=y*W+x;if(g[i]!==STEEL&&g[i]!==INBOX)g[i]=DIRT}
      g[ay*W+ax]=AMOEBA;
    }
  }
  // utgang
  const ex=W-3-Math.floor(r()*6),ey=2+Math.floor(r()*(H-4));g[ey*W+ex]=EXIT;
  let gems=0;for(let i=0;i<N;i++)if(g[i]===GEM)gems++;
  need=Math.max(10,Math.round((gems+bTotal*6)*0.36));
  gemVal=10+5*Math.floor(n/3);extraVal=Math.round(gemVal*1.5);
  timeLeft=Math.max(90,150-lv*5);
  palIdx=n%PAL.length;
}

function startCave(n){
  cave=n;genCave(n);spr=buildSprites(PAL[palIdx]);
  got=0;exitOpen=false;tickN=0;acc=0;ppos=-1;alive=true;deadT=0;winT=0;pushT=0;flash=0;face=0;paused=false;
  for(let i=0;i<N;i++)if(g[i]===INBOX){camX=(i%W)-VW/2;camY=Math.floor(i/W)-VH/2}
  clampCam(1);
  state='play';hideOv();
  const hasA=g.includes(AMOEBA);
  showBanner(`<b>${L('cave')} ${n+1}</b>${L('caves')[n%10]}${n>=10?' +':''}<br>${L('collect')} ${need} ◆${hasA?`<br><span style="color:#2fbf5a">${L('amoebaWarn')}</span>`:''}`);
  updHud(true);
}

// ---------- logikk ----------
let held=[],tap=-1,snapHeld=false;
function press(d){held=held.filter(x=>x!==d);held.push(d);tap=d}
function release(d){held=held.filter(x=>x!==d)}
function takeInput(){if(held.length){tap=-1;return held[held.length-1]}const t=tap;tap=-1;return t}

function mv(a,b){g[b]=g[a];fall[b]=fall[a];dir[b]=dir[a];g[a]=E;fall[a]=0;done[b]=1}
function killPlayer(){if(alive){alive=false;state='dead';deadT=0}}
function explode(c,r){
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const k=c+dy*W+dx,t=g[k];if(t===STEEL||t===EXIT)continue;
    if(t===PLAYER)killPlayer();
    g[k]=BOOM;stage[k]=0;res[k]=r;fall[k]=0;done[k]=1;
  }
  sfx('boom');
}
function collect(){
  got++;score+=got>need?extraVal:gemVal;sfx('gem');
  if(got===need&&!exitOpen){exitOpen=true;flash=1;sfx('exit')}
  checkLife();
}
function checkLife(){if(score>=nextLife){nextLife+=1000;if(lives<9){lives++;sfx('life');showBanner(`<b>${L('life')}</b>`)}}}

function physics(i){
  const t=g[i],b=i+W,bt=g[b];
  if(bt===E){mv(i,b);fall[b]=1;return}
  if(fall[i]&&(bt===PLAYER||bt===FLY||bt===BFLY)){fall[i]=0;explode(b,bt===BFLY?GEM:E);return}
  if(bt===ROCK||bt===GEM||bt===WALL){
    if(g[i-1]===E&&g[b-1]===E){mv(i,i-1);fall[i-1]=1;return}
    if(g[i+1]===E&&g[b+1]===E){mv(i,i+1);fall[i+1]=1;return}
  }
  if(fall[i]){fall[i]=0;sfx(t===GEM?'gemland':'rock')}
}
function enemy(i){
  const t=g[i];
  for(let d=0;d<4;d++)if(g[i+OFF[d]]===PLAYER||g[i+OFF[d]]===AMOEBA){explode(i,t===BFLY?GEM:E);return}
  const d=dir[i],turn=t===FLY?(d+3)%4:(d+1)%4;
  if(g[i+OFF[turn]]===E){dir[i]=turn;mv(i,i+OFF[turn])}
  else if(g[i+OFF[d]]===E)mv(i,i+OFF[d]);
  else{dir[i]=t===FLY?(d+1)%4:(d+3)%4;done[i]=1}
}
function playerStep(i){
  ppos=i;done[i]=1;
  if(!alive)return;
  const d=takeInput();if(d<0){pushT=0;return}
  if(d===3)face=-1;else if(d===1)face=1;
  const j=i+OFF[d],t=g[j];
  if(snapHeld){
    if(t===DIRT){g[j]=E;sfx('dig')}else if(t===GEM){g[j]=E;collect()}
    return;
  }
  if(t===E||t===DIRT){mv(i,j);ppos=j;lastMove=tickN;sfx(t===DIRT?'dig':'step');pushT=0}
  else if(t===GEM){collect();g[j]=E;mv(i,j);ppos=j;lastMove=tickN;pushT=0}
  else if(t===EXIT&&exitOpen){g[i]=E;ppos=j;winCave()}
  else if(t===ROCK&&(d===1||d===3)&&g[j+OFF[d]]===E&&!fall[j]){
    pushT++;lastMove=tickN;
    if(pushT>=2){mv(j,j+OFF[d]);mv(i,j);ppos=j;pushT=0;sfx('push')}
  }else pushT=0;
}
function tick(){
  done.fill(0);sfxThisTick={};tickN++;
  let amN=0,canGrow=false;const pGrow=tickN<280?0.025:0.14;
  for(let i=0;i<N;i++){
    if(done[i])continue;
    switch(g[i]){
      case ROCK:case GEM:physics(i);break;
      case FLY:case BFLY:enemy(i);break;
      case PLAYER:playerStep(i);break;
      case BOOM:if(++stage[i]>=5){g[i]=res[i];fall[i]=0}done[i]=1;break;
      case AMOEBA:{
        amN++;
        for(let d=0;d<4;d++){const t=g[i+OFF[d]];if(t===E||t===DIRT){canGrow=true;break}}
        if(Math.random()<pGrow){const j=i+OFF[Math.floor(Math.random()*4)];if(g[j]===E||g[j]===DIRT){g[j]=AMOEBA;done[j]=1;amN++}}
        break;}
      case INBOX:ppos=i;if(tickN>=18){g[i]=PLAYER;done[i]=1;sfx('appear')}break;
    }
  }
  amoebaN=amN;
  if(amN>0){
    if(amN>=AMOEBA_MAX){for(let i=0;i<N;i++)if(g[i]===AMOEBA)g[i]=ROCK;sfx('rock');showBanner(`<b>${L('amRock')}</b>`)}
    else if(!canGrow){for(let i=0;i<N;i++)if(g[i]===AMOEBA)g[i]=GEM;sfx('exit');flash=0.6;showBanner(`<b>${L('amGem')}</b>${L('amGem2')}`)}
    else if(tickN%9===0)sfx('blob');
  }
}
function winCave(){
  state='win';winT=0;sfx('win');
  unlocked=Math.max(unlocked,cave+2);
  try{localStorage.setItem('rr_unl',unlocked)}catch(e){}
}

// ---------- visning ----------
function clampCam(snap){
  if(ppos<0)return;
  const px=ppos%W,py=Math.floor(ppos/W);
  let tx=px+0.5-VW/2,ty=py+0.5-VH/2;
  tx=W<=VW?(W-VW)/2:Math.max(0,Math.min(W-VW,tx));
  ty=H<=VH?(H-VH)/2:Math.max(0,Math.min(H-VH,ty));
  if(snap){camX=tx;camY=ty}else return[tx,ty];
}
function draw(now){
  const cw=cv.width/dpr,ch=cv.height/dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,cw,ch);
  if(!spr)return;
  const ox=Math.round(-camX*T),oy=Math.round(-camY*T);
  const x0=Math.max(0,Math.floor(camX)),y0=Math.max(0,Math.floor(camY));
  const x1=Math.min(W-1,Math.ceil(camX+VW)),y1=Math.min(H-1,Math.ceil(camY+VH));
  const gf=Math.floor(now*7)%4,ff=Math.floor(now*14)%4,df=Math.floor(now*4)%2;
  const walking=tickN-lastMove<=1,blink=!walking&&(now%3.2)<0.15;
  const pk=(walking?face:0)+','+(walking?tickN%2:0)+','+(blink?1:0);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const i=y*W+x,t=g[i];let s=null;
    switch(t){
      case DIRT:s=spr.dirt;break;case WALL:s=spr.wall;break;case STEEL:s=spr.steel;break;
      case ROCK:s=spr.rock;break;case GEM:s=spr.gem[(gf+x)%4];break;
      case PLAYER:s=spr.pl[pk];break;case FLY:s=spr.fly[ff];break;case BFLY:s=spr.bfly[Math.floor(now*10)%4];break;
      case EXIT:s=exitOpen?spr.door[1+df]:spr.door[0];break;
      case INBOX:s=spr.door[df?2:0];break;
      case BOOM:s=spr.boom[Math.min(4,stage[i])];break;
      case AMOEBA:s=spr.amoeba[(Math.floor(now*5)+x+y)%4];break;
    }
    if(s)ctx.drawImage(s,ox+x*T,oy+y*T,T,T);
  }
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*0.6})`;ctx.fillRect(0,0,cw,ch)}
  if(paused){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,cw,ch);ctx.fillStyle='#ffcf3a';ctx.font='20px "Press Start 2P",monospace';ctx.textAlign='center';ctx.fillText('PAUSE',cw/2,ch/2)}
}
let hudCache='';
function updHud(force){
  const s=`${lang}|${cave}|${got}|${need}|${Math.ceil(timeLeft)}|${lives}|${score}|${exitOpen}`;
  if(s===hudCache&&!force)return;hudCache=s;
  $('hCave').textContent=L('c')+(cave+1);
  $('hGem').textContent=`◆ ${got}/${need}${exitOpen?' ✓':''}`;
  $('hTime').textContent=`⏱ ${Math.max(0,Math.ceil(timeLeft))}`;
  $('hTime').style.color=timeLeft<=10?'#ff5a4f':'';
  $('hLives').textContent=`♥ ${lives}`;
  $('hScore').textContent=String(score).padStart(6,'0');
}
let bannerTO=0;
function showBanner(html){const b=$('banner');b.innerHTML=html;b.style.opacity=1;clearTimeout(bannerTO);bannerTO=setTimeout(()=>b.style.opacity=0,2200)}

  help:'<span>Arrows / WASD</span> move · <span>Space + arrow</span> dig without moving<br><span>Esc</span> menu · <span>P</span> pause · <span>M</span> sound · <span>N</span> music<br>◆ collect · ● rocks fall · <span style="color:#ff8a00">■</span> fireflies explode · <span style="color:#ff5fb0">✦</span> butterflies turn into diamonds<br><span style="color:#2fbf5a">●</span> the amoeba grows: trap it = diamonds, let it grow too big = rocks',
  name:'Name',pts:'Score',empty:'No scores yet – be the first!',local:'High scores are saved on this device.',back:'◀ BACK',points:'points',
  retry:'↺ RESTART CAVE',home:'⌂ MAIN MENU',quit:'✕ QUIT GAME',pauseHelp:'Restarting the cave costs one life. The main menu keeps your game paused.',
  over:'GAME OVER',quitT:'GAME ENDED',madeTop:'You made the high score list! Enter your name:',save:'SAVE',again:'TRY AGAIN',menu:'MENU',unknown:'Unknown',
  cleared:'CLEARED!',gems:'diamonds',next:'NEXT CAVE ▶',dig:'DIG',digL:'Dig without moving',logo:'Rock Rush logo'}
};
let lang='no';
try{lang=localStorage.getItem('rr_lang')||((navigator.language||'').toLowerCase().match(/^(nb|nn|no|sv|da)/)?'no':'en')}catch(e){}
if(!TXT[lang])lang='no';
const L=k=>TXT[lang][k];
function applyLang(){document.documentElement.lang=lang==='no'?'no':'en';$('snap').textContent=L('dig');$('snap').setAttribute('aria-label',L('digL'));updHud(true)}
function setLang(l){lang=l;try{localStorage.setItem('rr_lang',l)}catch(e){}applyLang()}

// ---------- overlegg ----------
let gameActive=false,menuOpen=false,lastName='';
try{lastName=localStorage.getItem('rr_name')||''}catch(e){}
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hideOv(){$('ov').classList.add('hide');document.body.classList.remove('menu');menuOpen=false}
function showOv(html){$('card').innerHTML=html;$('ov').classList.remove('hide');document.body.classList.add('menu');$('ov').scrollTop=0;const b=$('card').querySelector('input,.btn');if(b)b.focus()}
function loadTop(){try{const t=JSON.parse(localStorage.getItem('rr_top')||'[]');return Array.isArray(t)?t:[]}catch(e){return[]}}
function saveTop(t){try{localStorage.setItem('rr_top',JSON.stringify(t))}catch(e){}}
function qualifies(sc){const t=loadTop();return sc>0&&(t.length<10||sc>t[t.length-1].s)}
function addTop(name,sc,cv){const t=loadTop();t.push({n:name.slice(0,12)||'Ukjent',s:sc,c:cv+1});t.sort((a,b)=>b.s-a.s);saveTop(t.slice(0,10))}
function topBest(){const t=loadTop();return Math.max(best,t.length?t[0].s:0)}
let logoURL='';
function makeLogo(S){
  const ts=S/4,s=buildSprites(PAL[7],Math.round(ts)),c=document.createElement('canvas');c.width=c.height=S;const k=c.getContext('2d');
  const r=S*0.18;k.beginPath();k.moveTo(r,0);k.arcTo(S,0,S,S,r);k.arcTo(S,S,0,S,r);k.arcTo(0,S,0,0,r);k.arcTo(0,0,S,0,r);k.closePath();k.clip();
  k.fillStyle='#000';k.fillRect(0,0,S,S);
  const L=[['rock',0,'gem','dirt'],['dirt','rock','dirt','wall'],['rock','pl','rock','gem'],['rock','dirt','rock','dirt']];
  L.forEach((row,y)=>row.forEach((n,x)=>{if(!n)return;const im=n==='gem'?s.gem[x%4]:n==='pl'?s.pl['0,0,0']:s[n];k.drawImage(im,x*ts,y*ts,ts,ts)}));
  return c.toDataURL('image/png');
}
function footer(){return `<p class="foot">© Wåle Production 2026</p>`}
function titleScreen(){
  if(!gameActive)state='title';
  if(gameActive){paused=true}
  menuOpen=true;
  let cvs='';for(let i=0;i<Math.min(unlocked,20);i++)cvs+=`<button class="cv${i===0?' on':''}" data-c="${i}" aria-label="${L('cave')} ${i+1}">${i+1}</button>`;
  showOv(`<div class="langs" role="group" aria-label="${L('lang')}"><button class="lg${lang==='no'?' on':''}" data-l="no">🇳🇴 Norsk</button><button class="lg${lang==='en'?' on':''}" data-l="en">🇬🇧 English</button></div>
  <img id="hero" src="${logoURL}" width="112" height="112" alt="${L('logo')}">
  <h1>ROCK RUSH</h1>
  <p class="big">${L('tag')}</p>
  ${gameActive?`<button class="btn" id="resume">${L('resume')}</button><br>`:''}
  <button class="btn${gameActive?' alt':''}" id="go">${gameActive?L('newg'):L('start')}</button>
  <button class="btn alt" id="top">${L('top')}</button>
  <p>${L('pick')}</p><div class="caves">${cvs}</div>
  <p>${L('rec')}: <span style="color:#ffcf3a">${String(topBest()).padStart(6,'0')}</span></p>
  <div class="help">${L('help')}</div>
  ${footer()}`);
  let sel=0;
  $('card').querySelectorAll('.lg').forEach(b=>b.onclick=()=>{setLang(b.dataset.l);titleScreen()});
  $('card').querySelectorAll('.cv').forEach(b=>b.onclick=()=>{sel=+b.dataset.c;$('card').querySelectorAll('.cv').forEach(x=>x.classList.toggle('on',x===b))});
  $('go').onclick=()=>{initAudio();lives=3;score=0;nextLife=1000;gameActive=true;startCave(sel)};
  $('top').onclick=()=>topScreen(titleScreen);
  if(gameActive)$('resume').onclick=resumeGame;
}
function topScreen(back){
  menuOpen=true;
  const t=loadTop();
  const rows=t.length?t.map((r,i)=>`<tr${i<3?` class="m${i}"`:''}><td>${i+1}.</td><td class="nm">${esc(r.n)}</td><td class="num">${esc(r.s)}</td><td class="num">${L('c')}${esc(r.c)}</td></tr>`).join('')
    :`<tr><td colspan="4" style="text-align:center;color:#aaa;padding:18px">${L('empty')}</td></tr>`;
  showOv(`<h2>${L('top')}</h2><table class="top"><thead><tr><th>#</th><th>${L('name')}</th><th class="num">${L('pts')}</th><th class="num">${L('cave')}</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="help">${L('local')}</p><button class="btn" id="back">${L('back')}</button>${footer()}`);
  $('back').onclick=back;
}
function resumeGame(){hideOv();paused=false;initAudio()}
function openMenu(){
  if(!gameActive||!(state==='play'||state==='dead'))return;
  if(menuOpen){resumeGame();return}
  paused=true;menuOpen=true;held=[];
  showOv(`<h2>PAUSE</h2><p class="big">${L('cave')} ${cave+1} · ◆ ${got}/${need} · ${score} ${L('points')}</p>
    <button class="btn" id="resume">${L('resume')}</button><br>
    <button class="btn alt" id="retry">${L('retry')}</button><br>
    <button class="btn alt" id="home">${L('home')}</button><br>
    <button class="btn alt" id="quit">${L('quit')}</button>
    <p class="help">${L('pauseHelp')}</p>${footer()}`);
  $('resume').onclick=resumeGame;
  $('retry').onclick=()=>{resumeGame();if(state==='play'&&alive&&ppos>=0&&g[ppos]===PLAYER)explode(ppos,E)};
  $('home').onclick=titleScreen;
  $('quit').onclick=()=>{paused=false;gameOverScreen('quitT')};
}
function gameOverScreen(key){
  state='over';gameActive=false;paused=false;menuOpen=true;
  if(score>best){best=score;try{localStorage.setItem('rr_best',best)}catch(e){}}
  const q=qualifies(score);
  showOv(`<h2>${L(key)}</h2><p class="big">${L('pts')}: ${score}</p><p>${L('cave')} ${cave+1}</p>
    ${q?`<p style="color:#ffcf3a">${L('madeTop')}</p>
      <form id="nf"><input id="nmIn" maxlength="12" autocomplete="off" value="${esc(lastName)}" placeholder="${L('name')}" aria-label="${L('name')}"><button class="btn" id="save">${L('save')}</button></form>`:''}
    <div id="after" ${q?'hidden':''}><button class="btn" id="again">${L('again')}</button><button class="btn alt" id="top">${L('top')}</button><button class="btn alt" id="menu">${L('menu')}</button></div>${footer()}`);
  $('again').onclick=()=>{lives=3;score=0;nextLife=1000;gameActive=true;startCave(cave)};
  $('menu').onclick=titleScreen;$('top').onclick=()=>topScreen(()=>gameOverScreen(key));
  if(q){
    $('nf').onsubmit=e=>{e.preventDefault();const n=$('nmIn').value.trim()||L('unknown');lastName=n;try{localStorage.setItem('rr_name',n)}catch(x){}
      addTop(n,score,cave);score=0;topScreen(titleScreen)};
  }
}
function deathScreen(){
  lives--;updHud(true);
  if(lives<=0)gameOverScreen('over');
  else startCave(cave);
}
function winScreen(){
  if(score>best){best=score;try{localStorage.setItem('rr_best',best)}catch(e){}}
  state='wonwait';
  showOv(`<h2>${L('cave').toUpperCase()} ${cave+1} ${L('cleared')}</h2><p class="big">◆ ${got} ${L('gems')}</p><p>${L('pts')}: ${score}</p>
    <button class="btn" id="next">${L('next')}</button><br><button class="btn alt" id="home">${L('home')}</button>`);
  $('next').onclick=()=>startCave(cave+1);
  $('home').onclick=()=>{cave++;startCave(cave);titleScreen()};
}

function setIcon(){if(document.querySelector('link[rel=icon][href$=".png"]'))return;const l=document.createElement('link');l.rel='icon';l.href=makeLogo(64);document.head.appendChild(l)}
// ---------- hovedløkke ----------
let last=performance.now();
function loop(ms){
  const now=ms/1000,dt=Math.min(0.1,(ms-last)/1000);last=ms;
  if(!paused&&(state==='play'||state==='dead')){
    acc+=dt;
    while(acc>=TICK){acc-=TICK;tick()}
    if(state==='play'&&tickN>=18){
      timeLeft-=dt;
      if(timeLeft<=10&&Math.floor(timeLeft+dt)!==Math.floor(timeLeft))sfx('tick'),sfxThisTick={};
      if(timeLeft<=0){timeLeft=0;if(ppos>=0&&g[ppos]===PLAYER)explode(ppos,E);else killPlayer()}
    }
    if(state==='dead'){deadT+=dt;if(deadT>2.2)deathScreen()}
  }
  if(state==='win'){
    winT+=dt;
    if(timeLeft>0&&winT>0.4){const k=Math.min(timeLeft,dt*60);timeLeft-=k;score+=Math.round(k*(1+Math.floor(cave/3)));if(!muted&&AC&&Math.random()<0.4)tone(1200+Math.random()*400,0.03,'square',0.03);checkLife()}
    else if(timeLeft<=0&&winT>1.2)winScreen();
  }
  if(flash>0)flash=Math.max(0,flash-dt*3);
  if(ppos>=0){const t=clampCam();if(t){const k=Math.min(1,dt*7);camX+=(t[0]-camX)*k;camY+=(t[1]-camY)*k}}
  draw(now);updHud();
  requestAnimationFrame(loop);
}

// ---------- størrelse ----------
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  const touch=matchMedia('(pointer:coarse)').matches;document.body.classList.toggle('touch',touch);
  const aw=window.innerWidth,ah=window.innerHeight-44;
  let cols=aw<520?13:aw<900?18:24;
  T=Math.floor(aw/cols);
  if(ah/T<9)T=Math.floor(ah/9);
  T=Math.max(16,Math.min(T,64));
  VW=aw/T;VH=ah/T;
  cv.style.width=aw+'px';cv.style.height=ah+'px';cv.width=Math.round(aw*dpr);cv.height=Math.round(ah*dpr);
  ctx.imageSmoothingEnabled=false;
  if(spr)spr=buildSprites(PAL[palIdx]);
  clampCam(1);
}
window.addEventListener('resize',resize);

// ---------- kontroller ----------
const KD={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
function togglePause(){if((state==='play'||state==='dead')&&!menuOpen){paused=!paused}}
function toggleMute(){muted=!muted;$('bMute').textContent=muted?'✕':'♪';initAudio();if(muted)stopMusic();else startMusic()}
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.code in KD){e.preventDefault();if(!e.repeat)press(KD[e.code])}
  else if(e.code==='Space'){e.preventDefault();snapHeld=true}
  else if(e.code==='KeyP')togglePause();
  else if(e.code==='KeyM')toggleMute();
  else if(e.code==='KeyN')toggleMusic();
  else if(e.code==='Escape'){if(state==='play'||state==='dead')openMenu()}
  else if(e.code==='Enter'){const b=$('ov').classList.contains('hide')?null:$('card').querySelector('.btn');if(b){e.preventDefault();b.click()}}
});
addEventListener('keyup',e=>{if(e.code in KD)release(KD[e.code]);else if(e.code==='Space')snapHeld=false});
addEventListener('blur',()=>{held=[];snapHeld=false});
document.querySelectorAll('#pad button').forEach(b=>{
  const d=+b.dataset.d;
  b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();b.setPointerCapture(e.pointerId);b.classList.add('on');press(d)});
  const up=()=>{b.classList.remove('on');release(d)};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
});
const sn=$('snap');
sn.addEventListener('pointerdown',e=>{e.preventDefault();sn.setPointerCapture(e.pointerId);snapHeld=true;sn.classList.add('on')});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>sn.addEventListener(ev,()=>{snapHeld=false;sn.classList.remove('on')}));
$('bMenu').onclick=()=>{initAudio();openMenu()};$('bMusic').onclick=toggleMusic;if(!musicOn){$('bMusic').style.opacity=.4}$('bMute').onclick=toggleMute;

addEventListener('pointerdown',()=>initAudio(),{once:true});addEventListener('keydown',()=>initAudio(),{once:true});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
resize();applyLang();logoURL=makeLogo(512);setIcon();titleScreen();updHud(true);requestAnimationFrame(loop);
}
</script>
